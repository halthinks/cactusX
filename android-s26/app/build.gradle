plugins { id 'com.android.application' }
android {
 namespace 'com.halthinks.cactusx'
 compileSdk 35
 defaultConfig { applicationId 'com.halthinks.cactusx'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1.0'
   externalNativeBuild { cmake { cppFlags '-std=c++17' } }
   ndk { abiFilters 'arm64-v8a' }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
 sourceSets { main { assets.srcDirs += ["../runtime-assets"] } }
 buildTypes { release { minifyEnabled false } }
}
